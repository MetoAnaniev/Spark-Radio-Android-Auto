# XcodeGen spec — run `xcodegen generate` on a Mac to produce RadioSpark.xcodeproj
name: RadioSpark
options:
  bundleIdPrefix: com.sparklab
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.6.3"
    CURRENT_PROJECT_VERSION: "10"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer Team ID
    SWIFT_VERSION: "5.9"
targets:
  RadioSpark:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RadioSpark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sparklab.radio
        PRODUCT_NAME: RadioSpark
        INFOPLIST_FILE: RadioSpark/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RadioSpark/Resources/RadioSpark.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: NO
